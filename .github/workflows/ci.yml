name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build ACT API stub
        shell: powershell
        run: msbuild ci\ActStub\ActStub.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Configuration Release -ActPath "$PWD\ci\ActStub\bin\Release"
