name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Validate tag
        shell: powershell
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tag must be vMAJOR.MINOR.PATCH' }
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git rev-parse --verify "refs/tags/$tag"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tag must be vMAJOR.MINOR.PATCH' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build ACT API stub
        shell: powershell
        run: msbuild ci\ActStub\ActStub.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Configuration Release -ActPath "$PWD\ci\ActStub\bin\Release"
      - name: Create validated assets
        shell: powershell
        run: .\release.ps1 -Version $env:RELEASE_VERSION -SkipBuild
      - name: Publish stable GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" "dist/Aether-Tracker-ACT-v$env:RELEASE_VERSION.zip" "dist/Aether-Tracker-ACT-v$env:RELEASE_VERSION.sha256" --verify-tag --generate-notes --title "Aether Tracker v$env:RELEASE_VERSION"
